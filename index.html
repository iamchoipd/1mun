{item:'고양이',unit:'마리',place:'마당에',add:'더 왔습니다',take:'다른 곳으로 갔습니다'},

];
const pick=a=>a[Math.floor(Math.random()*a.length)];
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){let j=rand(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
// 관형형 우리말 수사: '한 개', '스무 개', '스물한 개' 등
function koreanNum(n){
 const unit=['','한','두','세','네','다섯','여섯','일곱','여덟','아홉'];
 const teen=['열','열한','열두','열세','열네','열다섯','열여섯','열일곱','열여덟','열아홉'];
 const tens=['','','스물','서른','마흔','쉰','예순','일흔','여든','아흔'];
 if(n===0)return '영';if(n<10)return unit[n];if(n<20)return teen[n-10];
 const t=Math.floor(n/10),o=n%10;if(o===0)return n===20?'스무':tens[t];return tens[t]+unit[o];
}
function hasFinal(s){let c=s.charCodeAt(s.length-1);return c>=0xAC00&&c<=0xD7A3&&(c-0xAC00)%28!==0}
function particle(s,yes,no){return s+(hasFinal(s)?yes:no)}
function subject(s){return particle(s,'이','가')}
function topic(s){return particle(s,'은','는')}
function counter(n,o){return koreanNum(n)+' '+o.unit}
function withObj(n,o){return particle(counter(n,o),'을','를')}
function withSub(n,o){return particle(counter(n,o),'이','가')}
function finalQuestion(o){return topic(o.item)+' 모두 몇 '+o.unit+'일까요?'}
function remaining(o){return '남은 '+topic(o.item)+' 몇 '+o.unit+'일까요?'}
function createSentence(type,nums,o){
 const [a,b,c]=nums;
 const intro=`${o.place} ${subject(o.item)} ${counter(a,o)} 있었습니다.`;
 const countQ=`지금 ${topic(o.item)} 모두 몇 ${o.unit}일까요?`;
 const remainder=`${remaining(o)}`;
 if(type===0||type===4){
   const phrases=[
    `${intro} ${withObj(b,o)} ${o.add}. ${countQ}`,
    `${intro} 뒤이어 ${withObj(b,o)} ${o.add}. 이제 모두 몇 ${o.unit}일까요?`,
    `${intro} ${withObj(b,o)} ${o.add}. 지금 몇 ${o.unit}이 있을까요?`
   ];return pick(phrases);
 }
 if(type===3){
   const phrases=[
    `${intro} 먼저 ${withObj(b,o)} ${o.take}. 이어서 ${withObj(c,o)} ${o.take}. ${remainder}`,
    `${intro} ${withObj(b,o)} ${o.take}. 또 ${withObj(c,o)} ${o.take}. 지금 몇 ${o.unit}이 남았을까요?`,
    `${intro} 그중 ${withObj(b,o)} ${o.take}. 나중에 ${withObj(c,o)} ${o.take}. ${remainder}`
   ];return pick(phrases);
 }
 const phrases=[
  `${intro} 그중 ${withObj(b,o)} ${o.take}. ${remainder}`,
  `${intro} ${withObj(b,o)} ${o.take}. 지금 몇 ${o.unit}이 남았을까요?`,
  `${intro} ${withObj(b,o)} ${o.take}. ${o.place} ${subject(o.item)} 몇 ${o.unit} 남았을까요?`
 ];return pick(phrases);
}
// 정해진 연산 조건을 충족하는 계산식만 뽑습니다.
function operands(type){let a,b,c;
 switch(type){
 case 0:a=rand(1,8);b=rand(1,9-a);break;
 case 1:a=rand(2,9);b=rand(1,a-1);break;
 case 2:{let at=rand(2,9),bt=rand(1,at),ao=rand(0,9),bo=rand(0,ao);a=at*10+ao;b=bt*10+bo;if(a===b)return operands(type);break;}
 case 3:a=rand(4,9);b=rand(1,a-2);c=rand(1,a-b-1);break;
 case 4:a=rand(1,9);b=rand(Math.max(1,10-a),9);break;
 case 5:a=rand(11,18);b=rand(a-9,9);break;
 }
 return type===3?[a,b,c]:[a,b];
}
function getFormula(type,nums){return nums.join(type===0||type===4?'+':'-')}
function calculate(type,nums){return (type===0||type===4)?nums[0]+nums[1]:nums.reduce((a,b)=>a-b)}
function validProblem(type,n){const [a,b,c]=n;let ans=calculate(type,n);if(ans<0||!Number.isInteger(ans))return false;switch(type){
 case 0:return a>=1&&a<=9&&b>=1&&b<=9&&a+b<=9;
 case 1:return a>=1&&a<=9&&b>=1&&b<=9&&a>=b;
 case 2:return a>=10&&a<=99&&b>=10&&a>=b&&a%10>=b%10;
 case 3:return n.length===3&&a<=9&&b<=9&&c<=9&&a-b>=0&&a-b-c>=0;
 case 4:return a<=9&&b<=9&&a+b>=10;
 case 5:return a>=11&&a<=19&&b>=1&&b<=9&&a%10<b;
 default:return false;
}}
function nextType(p){if(p.bag.length===0)p.bag=shuffle([0,1,2,3,4,5]);return p.bag.pop()}
function makeProblem(p){
 p.asked++;
 const due=p.review.findIndex(r=>r.at<=p.asked);
 if(due>=0){const r=p.review.splice(due,1)[0];return generate(r.type,r.nums,p,true)}
 const type=nextType(p);
 for(let i=0;i<300;i++){
 const nums=operands(type);if(!validProblem(type,nums))continue;
 const f=getFormula(type,nums);
 if(p.recentForms.includes(f))continue;
 return generate(type,nums,p,false);
 }
 // 가능한 계산식이 부족할 때만 중복 조건을 완화합니다.
 let nums;do{nums=operands(type)}while(!validProblem(type,nums));return generate(type,nums,p,false);
}
function generate(type,nums,p,isReview){
 const f=getFormula(type,nums);
 let pool=objects.filter(o=>!p.recentObjects.slice(-9).includes(o.item));if(!pool.length)pool=objects;
 let o=pick(pool),q=createSentence(type,nums,o);
 for(let i=0;i<15&&(p.recentQuestions.includes(q));i++){o=pick(pool);q=createSentence(type,nums,o)}
 p.recentForms.push(f);if(p.recentForms.length>30)p.recentForms.shift();
 p.recentObjects.push(o.item);if(p.recentObjects.length>15)p.recentObjects.shift();
 p.recentQuestions.push(q);if(p.recentQuestions.length>30)p.recentQuestions.shift();
 const problem={type,nums:[...nums],formula:f,result:calculate(type,nums),unit:o.unit,text:q,isReview};
 if(!validProblem(type,nums)||problem.result!==calculate(type,nums))throw Error('출제 검증 오류');
 return problem;
}


const $=s=>document.querySelector(s);
const names=['가','나','다','라','마'];
const BOARD=false;
let count=2,players=[],turn=0,active=null,stage='formula',formula='',answer='',errors={formula:0,answer:0},feedback='',feedbackStyle='',endedWithEquals=false;
function makePlayer(i){return {name:names[i],bag:[],asked:0,review:[],recentForms:[],recentObjects:[],recentQuestions:[],problem:null}}
function player(){return players[turn]}
function nextProblem(){stage='formula';formula='';answer='';errors={formula:0,answer:0};feedback='';feedbackStyle='';endedWithEquals=false;active=player().problem=makeProblem(player());render();$('#mainContent').scrollTop=0}
function start(){players=Array.from({length:BOARD?count:1},(_,i)=>makePlayer(i));turn=0;if(BOARD)$('#setup').hidden=true;nextProblem()}
function render(){
 if(BOARD){$('#players').replaceChildren(...players.map((p,i)=>{let x=document.createElement('span');x.className='player'+(i===turn?' active':'');x.textContent=p.name+' 학생';return x}));$('#who').textContent=player().name+' 학생 차례 · 문제를 읽어 보세요.'}
 $('#question').textContent=active.text;
 $('#formula').textContent=formula.replace(/-/g,' − ').replace(/\+/g,' ＋ ')||'?';
 $('#answer').replaceChildren();$('#answer').append(document.createTextNode(answer||'?'));if(stage!=='formula'){let u=document.createElement('span');u.className='suffix';u.textContent=active.unit;$('#answer').append(u)}
 $('#formula').className='entry '+(stage==='formula'?'active':'finished');$('#answer').className='entry '+(stage==='formula'?'locked':stage==='answer'?'active':'finished');
 $('#feedback').textContent=feedback;$('#feedback').className='feedback '+feedbackStyle;
 $('#checkBtn').textContent=stage==='formula'?'식 확인':stage==='answer'?'정답 확인':'다음 문제';
 $('#checkBtn').disabled=stage==='formula'?!endedWithEquals:stage==='answer'?!answer:false;
 $('#keypad').querySelectorAll('button[data-key]').forEach(b=>{let k=b.dataset.key;b.disabled=stage==='reveal'||(stage==='answer'&&['+','-','='].includes(k))||(stage==='formula'&&endedWithEquals&&k!=='del')});
}
function put(k){
 if(stage==='reveal')return;
 if(k==='del'){if(stage==='formula'){formula=formula.slice(0,-1);endedWithEquals=false}else answer=answer.slice(0,-1)}
 else if(stage==='formula'){
   if(endedWithEquals||formula.length>=17)return;
   if(k==='='){if(formula&&!/[+\-]$/.test(formula)){formula+='=';endedWithEquals=true}}
   else if(k==='+'||k==='-'){if(formula&&!/[+\-]$/.test(formula))formula+=k}
   else if(/^\d$/.test(k)){let segment=formula.split(/[+\-]/).pop();if(segment.length>=2||segment==='0')return;formula+=k}
 }else if(/^\d$/.test(k)){if(answer.length>=3)return;answer=answer==='0'?k:answer+k}
 feedback='';feedbackStyle='';render();
}
function queueReview(){let p=player();if(p.review.some(x=>x.formula===active.formula))return;p.review.push({type:active.type,nums:[...active.nums],formula:active.formula,at:p.asked+5})}
function check(){
 if(stage==='reveal'){advance();return}
 if(stage==='formula'){
  if(!endedWithEquals)return;
  if(formula===active.formula+'='){stage='answer';errors.formula=0;feedback='식이 맞아요! 답을 입력해 보세요.';feedbackStyle='good'}
  else if(errors.formula===0){errors.formula=1;feedback='오답이에요! 식이 틀렸어요. 지우기 버튼으로 고치고 다시 확인해 보세요.';feedbackStyle='bad'}
  else{queueReview();stage='answer';feedback='오답이에요! 올바른 식은 '+(active.formula+'=').replace(/-/g,' − ').replace(/\+/g,' ＋ ')+' 입니다. 입력한 식은 그대로 두고 답을 계산해 보세요.';feedbackStyle='bad'}
 }else if(stage==='answer'){
  if(answer!==''&&Number(answer)===active.result){stage='reveal';feedback='정답이에요!';feedbackStyle='good'}
  else if(errors.answer===0){errors.answer=1;feedback='오답이에요! 답이 틀렸어요. 지우기 버튼으로 고치고 다시 계산해 보세요.';feedbackStyle='bad'}
  else{queueReview();stage='reveal';feedback='오답이에요! 정답은 '+active.result+active.unit+'입니다. 입력한 답은 그대로 두고 다음 문제에서 다시 연습해요.';feedbackStyle='bad'}
 }render();
}
function advance(){if(BOARD)turn=(turn+1)%players.length;nextProblem()}
function skip(){if(active.isReview)queueReview();advance()}
const keyOrder=['+','-','=','1','2','3','4','5','6','7','8','9','blank','0','del'];
for(let k of keyOrder){let b=document.createElement('button');b.type='button';b.className='key'+(['+','-'].includes(k)?' operator':k==='='?' equal':k==='del'?' delete':k==='blank'?' blank':'');b.textContent=k==='del'?'⌫ 지우기':k==='-'?'−':k==='blank'?'':k;b.setAttribute('aria-label',k==='del'?'한 글자 지우기':k==='-'?'빼기':k==='+'?'더하기':k==='='?'등호':k);if(k!=='blank')b.dataset.key=k;else b.disabled=true;$('#keypad').append(b)}
$('#keypad').addEventListener('click',e=>{let b=e.target.closest('[data-key]');if(b&&!b.disabled)put(b.dataset.key)});
$('#checkBtn').addEventListener('click',check);$('#skipBtn').addEventListener('click',skip);
$('#fullBtn').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){}});
document.addEventListener('fullscreenchange',()=>$('#fullBtn').textContent=document.fullscreenElement?'⛶ 종료':'⛶ 전체화면');
document.addEventListener('keydown',e=>{if(BOARD&& !$('#setup').hidden)return;if(e.ctrlKey||e.metaKey||e.altKey)return;let k=e.key;if(/^\d$/.test(k)||['+','-','='].includes(k))put(k);else if(k==='Backspace'){e.preventDefault();put('del')}else if(k==='Enter'){e.preventDefault();if(!$('#checkBtn').disabled)check()}});
if(BOARD){
 for(let i=1;i<=5;i++){let b=document.createElement('button');b.className='count'+(i===count?' sel':'');b.textContent=i+'명';b.dataset.count=i;$('#counts').append(b)}
 $('#counts').addEventListener('click',e=>{let b=e.target.closest('[data-count]');if(!b)return;count=Number(b.dataset.count);$('#counts').querySelectorAll('.count').forEach(x=>x.classList.toggle('sel',x===b))});
 $('#startBtn').addEventListener('click',start);$('#homeBtn').addEventListener('click',()=>{if(confirm('인원을 다시 선택할까요? 현재 문제는 초기화됩니다.'))$('#setup').hidden=false})
}else start();

</script></body></html>
